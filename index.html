 if(shotLim&&shotLim.maxBytes&&file.size>shotLim.maxBytes){st.textContent="That image is too large. Crop it or take a smaller screenshot.";return}
 shotBlob=file;shotItems=[];document.getElementById("aimgp").innerHTML=`<img src="${URL.createObjectURL(file)}" alt="Screenshot to read" style="max-width:100%;max-height:220px;border-radius:8px;margin-top:8px">`;document.getElementById("aread").disabled=false;st.textContent="";refresh()}
async function readShot(){const st=document.getElementById("ast"),b=document.getElementById("aread");if(!shotBlob)return;b.disabled=true;st.textContent="Reading the screenshot…";
 try{const s=await window.claude.use("sample");if(!s)throw{code:"unavailable"};
  const res=await s.json('This image is a screenshot from the mobile game Archero 2 showing guild boss damage scores. It may be a Discord message, an in-game leaderboard, or a results screen. List every player and their score or scores exactly as shown. Return JSON only, in this shape: {"date":"MM/DD or null","rows":[{"name":"player name exactly as written","scores":["score exactly as written, keeping units like B or T"]}]}. If a player shows two run scores, list both in order. Use a date only if one is clearly visible. Skip anything you cannot read clearly and never guess a number.',{images:[shotBlob]});
  const d=res&&res.date?pdate(String(res.date)):null;shotItems=(res&&Array.isArray(res.rows)?res.rows:[]).map(r=>({d,name:cleanName(String(r.name||"")),vals:(Array.isArray(r.scores)?r.scores:[]).map(pnum).filter(v=>v!==undefined)})).filter(x=>x.name&&x.vals.length&&!x.vals.some(v=>isNaN(v)));
  st.textContent=shotItems.length?"Found "+shotItems.length+" player"+(shotItems.length===1?"":"s")+". Check every number against the screenshot before saving.":"No scores could be read. Try a clearer or closer screenshot.";refresh()}
 catch(e){const c=e&&e.code;st.textContent=c==="not_granted"?"Screenshot reading was declined. Use Type it or Paste instead.":c==="rate_limited"?"Too many reads at once. Wait a minute and try again.":"Couldn’t read that screenshot. Try again, or use Paste.";}
 b.disabled=false}
async function save(){if(!Q.length||!pub)return;const btn=document.getElementById("svb"),st=document.getElementById("pst2");btn.disabled=true;st.textContent="Saving…";
 const nPL=PL.map(p=>({...p})),low={};nPL.forEach((p,i)=>low[p.n.toLowerCase()]=i);let nE=E.slice();
 Q.forEach(o=>{let pi=o.map;if(pi==null||pi<0){pi=low[o.name.toLowerCase()];if(pi==null){pi=nPL.length;nPL.push({n:o.name,cur:1});low[o.name.toLowerCase()]=pi}}
  const old=nE.find(e=>e[0]===o.d&&e[1]===pi);nE=nE.filter(e=>e!==old);let r1=o.r1,r2=o.r2;if(r1==null&&old&&old[3]!=null&&Math.abs(old[2]-o.t)<=Math.max(10,0.01*o.t)){r1=old[3];r2=old[4]}nE.push([o.d,pi,o.t,r1,r2,""])});
 nE.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:a[1]-b[1]);
 const json=JSON.stringify({players:nPL,e:nE,pbs:G.pbs||[]}).replace(/</g,"\\u003c"),SC="</"+"script>",css=document.getElementById("css").textContent;
 const html='<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bannedwords · Guild Boss Log</title>\n<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">\n<style id="css">'+css+'</style></head>\n<body><div class="wrap" id="app"><p class="sub">Loading…</p></div>\n<script id="gdata" type="application/json">'+json+SC+"\n<script>"+SRC+SC+"\n</body></html>";
 try{await pub.publish(html);PL=nPL;E=nE;G.players=nPL;G.e=nE;Q=[];shotItems=[];shotBlob=null;build();closeM();render()}
 catch(err){btn.disabled=false;const c=err&&err.code;st.textContent=c==="conflict"?"A newer version was saved elsewhere. The page will reload; add these again after.":c==="not_writer"||c==="not_granted"?"Only the page owner can save.":"Couldn’t save ("+(c||"error")+"). Nothing was changed."}}

<div class="tabs" role="tablist"><button type="button" role="tab" class="tab" data-t="type">Type it</button><button type="button" role="tab" class="tab" data-t="paste">Paste</button><button type="button" role="tab" class="tab" data-t="shot" id="tabshot" hidden>Screenshot</button></div>
<div class="bar dayrow"><label for="aday" style="margin:0">Day</label><input type="date" id="aday" value="${cd}"><span class="hint" id="aboss">${bossOf(cd)}</span></div>
<div data-p="type"><p class="lg">One row per player. Fill in run 1 and run 2, or just the total. Plain numbers are billions.</p><div id="trows"></div><button type="button" id="tadd" class="ghost">＋ Another player</button></div>

<details class="lg"><summary>What can I paste?</summary><ul><li><b>Ezoik 9.84T</b>: one score is the total.</li><li><b>Ezoik 5.08T 5.08T</b> or <b>Ezoik: 5.08T + 5.08T</b>: two scores are run 1 and run 2.</li><li><b>1. Laser - 13,600</b>: ranks, dashes, colons and commas are fine. Plain numbers are billions.</li><li><b>11/12 Bobbino 6.2T</b>: a date on the line beats the Day above.</li><li>A whole week block, or one day’s column, copied from the guild sheet.</li><li>Discord names, @mentions and times like “Today at 11:32 PM” are skipped.</li></ul></details></div>
<div data-p="shot" hidden><p class="lg">Choose a screenshot of scores, or paste one here. Claude reads the names and numbers; check them before saving.</p><input type="file" id="aimg" accept="image/*"><div id="aimgp"></div><div class="bar" style="margin-top:8px"><button type="button" id="aread" disabled>Read scores</button><span class="hint" id="ast"></span></div></div>

<div class="bar" style="margin-top:10px"><button type="button" id="svb" disabled>Save</button><span class="hint" id="pst2"></span></div></div></div>`}

async function dlPage(){const st=document.getElementById("dlst");const say=t=>{if(st)st.textContent=t};try{const d=await window.claude.use("downloads");if(!d){say("Downloads aren’t available in this view.");return}await d.save({filename:"index.html",data:new Blob([pageHTML(PL,E)],{type:"text/html"})});say("Saved index.html with every score so far. Upload it to GitHub to update the live page.")}catch(e){const c=e&&e.code;say(c==="unavailable"?"Downloads aren’t available in this view.":c&&/declin|dismiss|cancel|not_granted/.test(c)?"Download cancelled.":"Couldn’t download ("+(c||"error")+"). Nothing changed.")}}

 ob.onclick=()=>{m.hidden=false;showTab(addTab);refresh();checkShot();setTimeout(()=>{const t=addTab==="paste"?document.getElementById("pst"):document.querySelector("#trows .tn");if(t)t.focus()},60)};

 const ad=document.getElementById("aday");ad.onchange=()=>{document.getElementById("aboss").textContent=ad.value?bossOf(ad.value):"";refresh()};
 addTRow();document.getElementById("tadd").onclick=()=>{const r=addTRow();if(r)r.querySelector(".tn").focus()};

 m.addEventListener("paste",e=>{const it=[...((e.clipboardData||{}).items||[])].find(x=>x.type&&x.type.startsWith("image/"));if(it&&!document.getElementById("tabshot").hidden){e.preventDefault();addTab="shot";showTab("shot");setImg(it.getAsFile())}});
 document.getElementById("aread").onclick=readShot;document.getElementById("svb").onclick=save;
 m.addEventListener("click",e=>{const x=e.target.closest(".qx");if(x){Q.splice(+x.dataset.i,1);renderReview()}});

 {const b=document.getElementById("dlbtn");if(b)b.onclick=dlPage}wireAdd()}

const SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJmqdDH3vls50nF-g70VW6-nXs2b85Uqsdoirfk7s4SQ6aV8kzqXyujRTJN9k_p7wScZafVQzL2DSj/pub?gid=258379937&single=true&output=csv";
function csvRows(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}if(c!==""||r.length){r.push(c);rows.push(r)}return rows}
function fnum(s){s=String(s==null?"":s).trim();if(!s)return null;if(!/^\d+(\.\d+)?$/.test(s))return NaN;const v=+s;return v<=100000?v:NaN}
function fdate(s){const m=String(s||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;const d=m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");const t=D(d);if(isNaN(t)||iso(t)!==d||d<"2026-01-01"||t>Date.now()+2*864e5)return null;return d}
async function loadSheet(){const st=document.getElementById("sheetst");const say=x=>{if(st)st.textContent=x};
 try{const r=await fetch(SHEET,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const rows=csvRows(await r.text()).filter(x=>x.some(v=>String(v).trim()));
  if(rows.length<2){say("Up to date. No form entries yet.");return}
  const h=rows[0].map(x=>String(x).toLowerCase()),col=k=>h.findIndex(x=>x.includes(k));
  const cP=col("player"),cD=col("date"),c1=col("run 1"),c2=col("run 2"),cX=col("total");
  if(cP<0||cD<0)throw new Error("Player or Date column not found");
  const low={};PL.forEach((p,i)=>low[p.n.toLowerCase()]=i);const seen={};let skip=0;
  rows.slice(1).forEach(r=>{
   const name=String(r[cP]||"").replace(/^[\s=+\-@]+/,"").trim().slice(0,30);
   const d=fdate(r[cD]),a=c1>=0?fnum(r[c1]):null,b=c2>=0?fnum(r[c2]):null,t=cX>=0?fnum(r[cX]):null;
   if(!name||!d||[a,b,t].some(v=>Number.isNaN(v))){skip++;return}
   let tot,r1=null,r2=null;
   if(a!=null||b!=null){r1=a==null?0:a;r2=b==null?0:b;tot=r1+r2}else if(t!=null){tot=t}
   if(!(tot>0)){skip++;return}
   let pi=low[name.toLowerCase()];if(pi==null){pi=PL.length;PL.push({n:name,cur:1});low[name.toLowerCase()]=pi}
   seen[d+"|"+pi]=[d,pi,Math.round(tot*100)/100,r1,r2,""];
  });
  const keys=new Set(Object.keys(seen));
  E=E.filter(e=>!keys.has(e[0]+"|"+e[1])).concat(Object.values(seen));
  E.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:a[1]-b[1]);
  build();render();
  say("Up to date. "+keys.size+" form entr"+(keys.size===1?"y":"ies")+" loaded"+(skip?", "+skip+" skipped (bad number or date)":"")+".");
 }catch(err){say("Couldn’t load new form entries right now. Showing saved history. Refresh to try again.")}}
build();render();loadSheet();
